name: Quest 2 KernelSU Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "KernelSU flavour to build in"
        type: choice
        default: ksu
        options:
          - ksu    # original tiann/KernelSU v0.9.5
          - next   # KernelSU-Next (legacy branch)

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Run Quest 2 build with KernelSU
        working-directory: q2_build
        env:
          KERNEL_COMMIT: "5a02b7f302c9c1a3d979283576d3caa7724306a2"
          KSU_VARIANT: ${{ inputs.variant }}

        run: |
          chmod +x build.sh
          KSU=1 ./build.sh

      - name: Upload Quest 2 KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: quest2-kernelsu-${{ inputs.variant }}-5a02b7f
          path: |
            q2_build/build/oculus-quest2-device-kernel/Image
            q2_build/build/oculus-quest2-device-kernel/Image.gz-dtb
            q2_build/build/oculus-quest2-device-kernel/vmlinux
            q2_build/build/oculus-quest2-device-kernel/System.map
            q2_build/build/oculus-quest2-device-kernel/.config
            q2_build/build/oculus-quest2-device-kernel/boot-repacked.img
            q2_build/build/oculus-quest2-device-kernel/dtbs/**
          if-no-files-found: warn
