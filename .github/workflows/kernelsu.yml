name: Quest 1 KernelSU Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "KernelSU flavour to build in"
        type: choice
        default: next
        options:
          - next   # KernelSU-Next (as shipped in the kernel fork)
          - ksu    # original tiann/KernelSU v0.9.5

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Run Quest 1 build
        working-directory: q1_build
        env:
          # Keep the real Quest kernel's verity workaround.
          VERITY_BYPASS: "1"
          KERNEL_COMMIT: ""
          KSU_VARIANT: ${{ inputs.variant }}

        run: |
          chmod +x kernelsu.sh
          KSU=1 ./kernelsu.sh

      - name: Upload Quest 1 kernel
        uses: actions/upload-artifact@v4
        with:
          name: quest1-kernel-${{ inputs.variant }}
          path: |
            q1_build/build/oculus-quest1-device-kernel/Image
            q1_build/build/oculus-quest1-device-kernel/Image.gz-dtb
            q1_build/build/oculus-quest1-device-kernel/vmlinux
            q1_build/build/oculus-quest1-device-kernel/System.map
            q1_build/build/oculus-quest1-device-kernel/.config
            q1_build/build/oculus-quest1-device-kernel/boot-repacked.img
          if-no-files-found: error
